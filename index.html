<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day 💖</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<div class="card active">
<h1>💖 Happy Friendship Day 💖</h1>
<p>You are one of the best people in my life.</p>
<button onclick="nextCard()">Next ➜</button>
</div>

<div class="card">
<h1>🌸 Thank You 🌸</h1>
<p>Thank you for every smile and every memory.</p>
<button onclick="nextCard()">Next ➜</button>
</div>

<div class="card">
<h1>✨ Forever Friends ✨</h1>
<p>No matter what happens, our friendship stays strong.</p>
<button onclick="nextCard()">Next ➜</button>
</div>

<div class="card">
<h1>🎁 Surprise 🎁</h1>
<p>You are amazing! ❤️</p>
<button onclick="showHearts()">Tap Me 💕</button>
</div>

</div>

<div id="hearts"></div>

<script src="script.js"></script>

</body>
</html>
